<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>The Lazarus League — Glovo Nigeria</title>
  <style>
    /* PRD Section 10 tokens. System font stack rather than a Google Fonts
       request — one less blocking third-party load on an internal tool. */
    *{box-sizing:border-box}
    body{margin:0;background:#F5F5F7;color:#1D1D1F;-webkit-font-smoothing:antialiased;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
    .card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
    select,input[type=text],input[type=date],textarea{border:1px solid #E5E5EA;border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit;color:#1D1D1F}
    textarea{width:100%;resize:vertical;min-height:70px}
    button{font-family:inherit}
    .btn{border:none;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer}
    .btn-dark{background:#1D1D1F;color:#FFC244}
    .btn-light{background:#F0F0F2;color:#5A5A63}
    .btn-green{background:#00A082;color:#fff}
    .btn-red{background:#FEF2F2;color:#DC2626}
    .btn:disabled{opacity:.5;cursor:default}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .empty{color:#8E8E93;font-size:13px;text-align:center;padding:60px 0;line-height:1.6}
    .bar{height:8px;border-radius:4px;overflow:hidden}
    .badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
    @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.35}}
    .dot{width:6px;height:6px;border-radius:50%;flex:none;animation:pulse-dot 1.6s infinite}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;font-size:9.5px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid #F0F0F2}
    td{font-size:12.5px;padding:10px;border-bottom:1px solid #F5F5F7;vertical-align:top}
    tr.overdue-row td{background:#FEF9F5}
    .tablewrap{overflow-x:auto}
    .navbtn{padding:9px 16px;border-radius:10px;border:none;font-size:12.5px;font-weight:700;cursor:pointer;background:transparent;color:#5A5A63}
    .navbtn.active{background:#1D1D1F;color:#FFC244}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
    .modal-box{background:#fff;border-radius:18px;padding:22px;max-width:420px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25)}
    @media (max-width:820px){ .cols{grid-template-columns:1fr !important} .board-row,.board-head{grid-template-columns:36px 1fr 90px 70px !important} .col-react{display:none} .stat-grid{grid-template-columns:1fr 1fr !important} }
  </style>
</head>
<body>
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap">
      <div>
        <div class="mono" style="font-size:10.5px;font-weight:600;color:#8E8E93;text-transform:uppercase;letter-spacing:.08em">The Lazarus League</div>
        <h1 id="selfName" style="font-weight:800;font-size:22px;margin:2px 0 0">Loading…</h1>
        <div id="weekLabel" style="font-size:11px;color:#8E8E93;margin-top:3px"></div>
      </div>
      <div style="text-align:right">
        <select id="amSelect"></select>
        <div id="identityNote" style="font-size:10px;color:#8E8E93;margin-top:5px"></div>
        <div id="liveNote" style="font-size:10px;color:#8E8E93;margin-top:3px;display:flex;align-items:center;justify-content:flex-end;gap:5px"></div>
      </div>
    </div>

    <div style="display:flex;gap:4px;padding:4px;border-radius:14px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08);margin-bottom:18px;flex-wrap:wrap">
      <button class="navbtn active" id="navbtn-overview" onclick="showTab('overview')">Overview</button>
      <button class="navbtn" id="navbtn-roster" onclick="showTab('roster')">Partner Roster</button>
      <button class="navbtn" id="navbtn-tasks" onclick="showTab('tasks')">Tasks</button>
      <button class="navbtn" id="navbtn-leaderboard" onclick="showTab('leaderboard')">Leaderboard</button>
    </div>

    <div id="tab-overview"><div class="empty">Loading…</div></div>
    <div id="tab-roster" hidden><div class="empty">Loading…</div></div>
    <div id="tab-tasks" hidden><div class="empty">Loading…</div></div>
    <div id="tab-leaderboard" hidden><div class="empty">Loading The Lazarus League…</div></div>
  </div>

  <div id="modalRoot"></div>

  <script>
    // Colors kept mapped by rank POSITION (lowest to highest), matching
    // RANK_TIERS in Code.gs — gray, teal, purple, gold.
    var RANK_COLOR = { 'Prime Resurrector':'#B8860B', 'Miracle Worker':'#6D28D9', Restorer:'#00A082', Awakener:'#9CA3AF' };
    var STATUS_COLOR = { Assigned:'#B8860B', 'Under Review':'#6D28D9', Approved:'#00A082' };
    var STATUS_BG = { Assigned:'#FFFBEC', 'Under Review':'#F5F3FF', Approved:'#F0FDF9' };

    // Store/AM/task text comes from a hand-edited Sheet and was previously
    // concatenated straight into innerHTML. A name containing & or < broke
    // the page silently; anything worse was an injection into an internal
    // dashboard. Everything from the Sheet goes through esc() now.
    function esc(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }
    function $(id){ return document.getElementById(id); }
    function fmtDate(v){
      if (!v) return '—';
      var d = new Date(v);
      if (isNaN(d.getTime())) return String(v);
      return d.toLocaleDateString('en-NG', { day:'numeric', month:'short', year:'numeric' });
    }

    // ---- Identity + AM list --------------------------------------------
    var currentEmail = null;
    var viewerIsReviewer = false;
    var amList = [];

    function init(){
      // Ask who the viewer is first. On a domain-restricted deployment this
      // lands the AM straight on their own dashboard; otherwise it comes
      // back empty and the picker takes over.
      google.script.run.withSuccessHandler(function(viewer){
        google.script.run.withSuccessHandler(function(reviewerFlag){
          viewerIsReviewer = !!reviewerFlag;
          google.script.run.withSuccessHandler(function(ams){
            amList = ams || [];
            var sel = $('amSelect');
            if (!amList.length) {
              $('tab-leaderboard').innerHTML = '<div class="empty">The <b>AMs</b> tab is empty.<br>Add <code>am_name</code> and <code>am_email</code> rows to the Sheet, then reload.</div>';
              $('selfName').textContent = 'No AMs found';
              return;
            }
            sel.innerHTML = amList.map(function(a){
              return '<option value="'+esc(a.am_email)+'">'+esc(a.am_name)+'</option>';
            }).join('');

            var match = null;
            for (var i=0;i<amList.length;i++) if (amList[i].am_email === viewer) match = amList[i].am_email;

            if (match) {
              $('identityNote').textContent = 'Signed in as ' + viewer + (viewerIsReviewer ? ' · reviewer' : '');
              sel.style.display = 'none';           // no reason to let an AM
              $('identityNote').style.display = ''; // browse as someone else
            } else {
              $('identityNote').textContent = (viewer
                ? 'Signed in as ' + viewer + ' — not in the AMs tab'
                : 'Viewing as (identity unavailable)') + (viewerIsReviewer ? ' · reviewer' : '');
            }
            currentEmail = match || amList[0].am_email;
            sel.value = currentEmail;
            loadFor(currentEmail);
            loadOverview();
          }).getAmList();
        }).isReviewer();
      }).withFailureHandler(fail).getViewerEmail();
    }

    function fail(err){
      $('tab-leaderboard').innerHTML = '<div class="empty">Couldn’t load The Lazarus League.<br>' +
        esc(err && err.message ? err.message : err) + '</div>';
    }

    // ---- Tabs ------------------------------------------------------------
    var TABS = ['overview','roster','tasks','leaderboard'];
    var tabLoaded = {};

    function showTab(name){
      TABS.forEach(function(t){
        $('tab-'+t).hidden = (t !== name);
        $('navbtn-'+t).className = 'navbtn' + (t === name ? ' active' : '');
      });
      if (name === 'roster' && !tabLoaded.roster) loadRoster();
      if (name === 'tasks' && !tabLoaded.tasks) loadTasks();
    }

    // ---- Auto-refresh (Leaderboard tab; the others refresh when opened) --
    // Data underneath only actually changes when pullEvents() writes back
    // to the Sheet (every 15 min) or the daily orders refresh runs, so
    // polling faster than that just burns Apps Script execution quota for
    // no new information. 2 minutes is frequent enough that an AM watching
    // the board never has a reason to hit browser-refresh, without being
    // wasteful.
    var REFRESH_MS = 120000;

    function loadFor(email){
      currentEmail = email;
      $('amSelect').value = email;
      $('tab-leaderboard').innerHTML = '<div class="empty">Loading…</div>';
      google.script.run.withSuccessHandler(function(data){ renderLeaderboard(data); markUpdated(); })
        .withFailureHandler(fail).getLazarusLeagueJson(email);
    }

    /**
     * Same call as loadFor(), but silent: no "Loading…" flash, and a
     * transient error just skips this cycle rather than blanking out a
     * dashboard that was working fine a moment ago. This is what runs on
     * the timer while an AM has the tab open and isn't touching anything.
     */
    function silentRefresh(){
      if (!currentEmail) return;
      google.script.run
        .withSuccessHandler(function(data){
          if (data && data.error) return; // keep last-good state, try again next cycle
          renderLeaderboard(data);
          markUpdated();
        })
        .withFailureHandler(function(){ /* same — last-good state stands */ })
        .getLazarusLeagueJson(currentEmail);
    }

    function markUpdated(){
      var now = new Date();
      var hh = ('0'+now.getHours()).slice(-2), mm = ('0'+now.getMinutes()).slice(-2);
      $('liveNote').innerHTML = '<div class="dot" style="background:#00A082"></div>Live · updated ' + hh + ':' + mm;
    }

    // =======================================================================
    // OVERVIEW TAB
    // =======================================================================
    function loadOverview(){
      tabLoaded.overview = true;
      google.script.run.withSuccessHandler(renderOverview).withFailureHandler(function(err){
        $('tab-overview').innerHTML = '<div class="empty">Couldn’t load Overview.<br>'+esc(err && err.message ? err.message : err)+'</div>';
      }).getOverview();
    }

    function statCard(label, value, color){
      return '<div class="card" style="padding:16px"><div style="font-size:9.5px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">'+esc(label)+'</div>'+
        '<div class="mono" style="font-weight:800;font-size:22px;color:'+color+'">'+esc(value)+'</div></div>';
    }

    function renderOverview(data){
      if (data && data.error) { $('tab-overview').innerHTML = '<div class="empty">'+esc(data.error)+'</div>'; return; }

      var html = '';
      html += '<div class="stat-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px">';
      html += statCard('Accepted Partners', data.acceptedPartnerCount, '#1D1D1F');
      html += statCard('Awaiting Review', data.pendingReviewCount, '#6D28D9');
      html += statCard('Overdue Tasks', data.overdueCount, data.overdueCount ? '#DC2626' : '#1D1D1F');
      html += statCard('Avg. AM Turnaround', data.avgAmTurnaroundDays == null ? '—' : data.avgAmTurnaroundDays + 'd', '#00A082');
      html += '</div>';

      if (!data.tasksTabExists) {
        html += '<div class="card" style="padding:18px 20px;margin-bottom:18px;background:#FFFBEC;border:1px solid rgba(255,194,68,.3)">'+
          '<div style="font-weight:800;font-size:13px;margin-bottom:4px">Tasks tab not set up yet</div>'+
          '<div style="font-size:12px;color:#5A5A63;line-height:1.6">Add a <b>Tasks</b> tab (and optionally <b>TaskHistory</b>) to the Sheet — see the TASK MANAGEMENT comment at the top of Code.gs for exact headers. This Overview and the Tasks tab will populate automatically once it exists.</div></div>';
      }

      html += '<div class="cols" style="display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;margin-bottom:18px">';

      // Completed-over-time chart — plain CSS bars, no charting library.
      html += '<div class="card" style="padding:20px">';
      html += '<div class="mono" style="font-size:10.5px;font-weight:600;color:#8E8E93;text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px">Tasks Completed — Last 8 Weeks</div>';
      var maxCount = Math.max.apply(null, data.completedOverTime.map(function(w){return w.count;}).concat([1]));
      html += '<div style="display:flex;align-items:flex-end;gap:10px;height:120px">';
      data.completedOverTime.forEach(function(w){
        var h = Math.round((w.count / maxCount) * 100);
        html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">'+
          '<div class="mono" style="font-size:10px;font-weight:700;color:#1D1D1F;margin-bottom:4px">'+w.count+'</div>'+
          '<div style="width:100%;max-width:28px;height:'+Math.max(h,4)+'%;background:#00A082;border-radius:4px 4px 0 0"></div>'+
          '<div style="font-size:9px;color:#8E8E93;margin-top:6px;white-space:nowrap">'+esc(w.label)+'</div></div>';
      });
      html += '</div></div>';

      // Aging / SLA
      html += '<div class="card" style="padding:20px">';
      html += '<div class="mono" style="font-size:10.5px;font-weight:600;color:#8E8E93;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px">Aging &amp; SLA</div>';
      html += '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:10px"><span style="color:#5A5A63">Avg. full cycle (assigned → approved)</span><span class="mono" style="font-weight:700">'+(data.avgFullCycleDays==null?'—':data.avgFullCycleDays+'d')+'</span></div>';
      html += '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:10px"><span style="color:#5A5A63">Avg. AM turnaround</span><span class="mono" style="font-weight:700">'+(data.avgAmTurnaroundDays==null?'—':data.avgAmTurnaroundDays+'d')+'</span></div>';
      if (data.oldestOpenTask) {
        html += '<div style="margin-top:14px;padding:10px;border-radius:10px;background:#FEF9F5;border:1px solid rgba(220,38,38,.15)">'+
          '<div style="font-size:10px;font-weight:700;color:#DC2626;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">Oldest Open Task</div>'+
          '<div style="font-size:12.5px;font-weight:600">'+esc(data.oldestOpenTask.taskType)+' · '+data.oldestOpenTask.days+' day'+(data.oldestOpenTask.days===1?'':'s')+' old</div>'+
          '<div style="font-size:11px;color:#8E8E93;margin-top:2px">Assigned to '+esc(data.oldestOpenTask.amEmail)+'</div></div>';
      } else {
        html += '<div style="font-size:12px;color:#8E8E93;margin-top:8px">No open tasks.</div>';
      }
      html += '</div>';
      html += '</div>'; // end cols

      // AM expectations
      html += '<div class="card" style="padding:20px;margin-bottom:18px">';
      html += '<div class="mono" style="font-size:10.5px;font-weight:600;color:#8E8E93;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">Account Manager Expectations</div>';
      html += '<div style="font-size:13px;line-height:1.7;color:#3A3A3C;white-space:pre-line">'+esc(data.amExpectations)+'</div></div>';

      // Overdue list
      if (data.overdueTasks && data.overdueTasks.length) {
        html += '<div class="card" style="padding:20px">';
        html += '<div class="mono" style="font-size:10.5px;font-weight:600;color:#DC2626;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">Overdue Right Now</div>';
        data.overdueTasks.forEach(function(t,i){
          html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;'+(i>0?'border-top:1px solid #F5F5F7':'')+'">'+
            '<div><div style="font-size:12.5px;font-weight:700">'+esc(t.taskType)+(t.partnerSaid?' · '+esc(t.partnerSaid):'')+'</div>'+
            '<div style="font-size:11px;color:#8E8E93">'+esc(t.amEmail)+' · due '+fmtDate(t.dueDate)+'</div></div>'+
            '<span class="badge" style="background:#FEF2F2;color:#DC2626">Overdue</span></div>';
        });
        html += '</div>';
      }

      $('tab-overview').innerHTML = html;
    }

    // =======================================================================
    // PARTNER ROSTER TAB
    // =======================================================================
    var rosterData = [];
    var rosterAmFilter = '';
    var rosterSearch = '';

    function loadRoster(){
      tabLoaded.roster = true;
      google.script.run.withSuccessHandler(function(data){
        if (data && data.error) { $('tab-roster').innerHTML = '<div class="empty">'+esc(data.error)+'</div>'; return; }
        rosterData = data || [];
        rosterAmFilter = currentEmail || '';
        renderRosterShell();
      }).withFailureHandler(function(err){
        $('tab-roster').innerHTML = '<div class="empty">Couldn’t load the roster.<br>'+esc(err && err.message ? err.message : err)+'</div>';
      }).getPartnerRoster();
    }

    function renderRosterShell(){
      var amOptions = '<option value="">All Account Managers</option>' + amList.map(function(a){
        return '<option value="'+esc(a.am_email)+'"'+(a.am_email===rosterAmFilter?' selected':'')+'>'+esc(a.am_name)+'</option>';
      }).join('');
      var html = '<div class="card" style="padding:16px 20px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+
        '<select id="rosterAmFilter" onchange="onRosterAmFilterChange(this.value)">'+amOptions+'</select>'+
        '<input type="text" id="rosterSearch" placeholder="Search store or SAID…" oninput="onRosterSearch(this.value)" style="flex:1;min-width:180px">'+
        '<div id="rosterCount" class="mono" style="font-size:11px;color:#8E8E93;margin-left:auto"></div>'+
        '</div><div id="rosterTableWrap" class="card tablewrap" style="padding:4px"></div>';
      $('tab-roster').innerHTML = html;
      renderRosterTable();
    }

    function onRosterAmFilterChange(v){ rosterAmFilter = v; renderRosterTable(); }
    function onRosterSearch(v){ rosterSearch = v.toLowerCase(); renderRosterTable(); }

    function renderRosterTable(){
      var rows = rosterData.filter(function(p){
        if (rosterAmFilter && p.amEmail !== rosterAmFilter) return false;
        if (rosterSearch) {
          var hay = (p.storeName + ' ' + p.said).toLowerCase();
          if (hay.indexOf(rosterSearch) < 0) return false;
        }
        return true;
      });
      $('rosterCount').textContent = rows.length + ' of ' + rosterData.length + ' accepted partner(s)';

      if (!rows.length) {
        $('rosterTableWrap').innerHTML = '<div class="empty">No partners match this filter.</div>';
        return;
      }
      var html = '<table><thead><tr><th>Store</th><th>SAID</th><th>Account Manager</th><th>Tier</th><th style="text-align:right">Orders</th><th style="text-align:right">Uptime</th><th>Accepted</th></tr></thead><tbody>';
      rows.forEach(function(p){
        var uptimeColor = p.uptime == null ? '#B0B0B5' : p.uptime >= 70 ? '#00A082' : p.uptime >= 40 ? '#B8860B' : '#DC2626';
        html += '<tr><td style="font-weight:700">'+esc(p.storeName)+'</td>'+
          '<td class="mono">'+esc(p.said)+'</td>'+
          '<td>'+esc(p.amName)+'</td>'+
          '<td>'+esc(p.tierDisplay)+'</td>'+
          '<td class="mono" style="text-align:right">'+p.ordersDelivered+'</td>'+
          '<td class="mono" style="text-align:right;color:'+uptimeColor+';font-weight:700">'+(p.uptime==null?'—':p.uptime+'%')+'</td>'+
          '<td style="color:#8E8E93">'+fmtDate(p.acceptedAt)+'</td></tr>';
      });
      html += '</tbody></table>';
      $('rosterTableWrap').innerHTML = html;
    }

    // =======================================================================
    // TASKS TAB
    // =======================================================================
    var tasksData = [];
    var taskTemplates = [];
    var taskStatusFilter = '';
    var taskAmFilter = '';
    var taskOverdueOnly = false;
    var expandedTaskId = null;

    function loadTasks(){
      tabLoaded.tasks = true;
      google.script.run.withSuccessHandler(function(data){
        if (data && data.error) {
          $('tab-tasks').innerHTML = '<div class="empty">'+esc(data.error)+
            '<br><br>If this says the Tasks tab wasn\'t found, add it — see the TASK MANAGEMENT comment at the top of Code.gs for exact headers.</div>';
          return;
        }
        tasksData = data || [];
        taskAmFilter = currentEmail || '';
        if (viewerIsReviewer) {
          google.script.run.withSuccessHandler(function(t){ taskTemplates = t || []; renderTasksShell(); }).getTaskTemplates();
        } else {
          renderTasksShell();
        }
      }).withFailureHandler(function(err){
        $('tab-tasks').innerHTML = '<div class="empty">Couldn’t load Tasks.<br>'+esc(err && err.message ? err.message : err)+'</div>';
      }).getTasks();
    }

    function renderTasksShell(){
      var html = '';

      if (viewerIsReviewer) {
        html += '<div class="card" style="padding:18px 20px;margin-bottom:14px">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleAssignForm()">'+
          '<div class="mono" style="font-size:10.5px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:.08em">Assign a New Task</div>'+
          '<span id="assignToggleIcon" style="font-size:11px;color:#8E8E93">Show ▾</span></div>'+
          '<div id="assignForm" hidden style="margin-top:14px">'+assignFormHtml()+'</div></div>';
      }

      var amOptions = '<option value="">All Account Managers</option>' + amList.map(function(a){
        return '<option value="'+esc(a.am_email)+'"'+(a.am_email===taskAmFilter?' selected':'')+'>'+esc(a.am_name)+'</option>';
      }).join('');
      html += '<div class="card" style="padding:16px 20px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+
        '<select onchange="taskStatusFilter=this.value;renderTasksTable()"><option value="">All statuses</option><option value="Assigned">Assigned</option><option value="Under Review">Under Review</option><option value="Approved">Approved</option></select>'+
        '<select onchange="taskAmFilter=this.value;renderTasksTable()">'+amOptions+'</select>'+
        '<label style="font-size:12.5px;color:#5A5A63;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" onchange="taskOverdueOnly=this.checked;renderTasksTable()"> Overdue only</label>'+
        '<div id="taskCount" class="mono" style="font-size:11px;color:#8E8E93;margin-left:auto"></div></div>';

      html += '<div id="tasksTableWrap"></div>';
      $('tab-tasks').innerHTML = html;
      renderTasksTable();
    }

    function assignFormHtml(){
      var amOptions = amList.map(function(a){ return '<option value="'+esc(a.am_email)+'">'+esc(a.am_name)+'</option>'; }).join('');
      var tmplOptions = taskTemplates.map(function(t,i){ return '<option value="'+i+'">'+esc(t.type)+'</option>'; }).join('');
      return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">'+
        '<div><div style="font-size:11px;font-weight:600;color:#8E8E93;margin-bottom:4px">Account Manager</div><select id="af_am" style="width:100%">'+amOptions+'</select></div>'+
        '<div><div style="font-size:11px;font-weight:600;color:#8E8E93;margin-bottom:4px">Template</div><select id="af_template" style="width:100%" onchange="applyTaskTemplate(this.value)">'+tmplOptions+'</select></div>'+
        '</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">'+
        '<div><div style="font-size:11px;font-weight:600;color:#8E8E93;margin-bottom:4px">Partner SAID (optional)</div><input type="text" id="af_said" placeholder="6-digit SAID" style="width:100%" maxlength="6"></div>'+
        '<div><div style="font-size:11px;font-weight:600;color:#8E8E93;margin-bottom:4px">Due date</div><input type="date" id="af_due" style="width:100%"></div>'+
        '</div>'+
        '<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:600;color:#8E8E93;margin-bottom:4px">Description</div><textarea id="af_desc"></textarea></div>'+
        '<div id="assignError" style="font-size:12px;color:#DC2626;margin-bottom:8px"></div>'+
        '<button class="btn btn-dark" onclick="submitAssignTask()">Assign Task</button>';
    }

    function toggleAssignForm(){
      var f = $('assignForm');
      f.hidden = !f.hidden;
      $('assignToggleIcon').textContent = f.hidden ? 'Show ▾' : 'Hide ▴';
      if (!f.hidden) applyTaskTemplate(0);
    }

    function applyTaskTemplate(idx){
      var t = taskTemplates[Number(idx)];
      if (!t) return;
      $('af_desc').value = t.description;
      var due = new Date();
      due.setDate(due.getDate() + (t.dueInDays || 3));
      $('af_due').value = due.toISOString().slice(0,10);
    }

    function submitAssignTask(){
      var payload = {
        amEmail: $('af_am').value,
        taskType: taskTemplates[Number($('af_template').value)] ? taskTemplates[Number($('af_template').value)].type : 'Custom',
        description: $('af_desc').value,
        partnerSaid: $('af_said').value,
        dueDate: $('af_due').value,
      };
      $('assignError').textContent = '';
      google.script.run.withSuccessHandler(function(res){
        if (res && res.error) { $('assignError').textContent = res.error; return; }
        toggleAssignForm();
        $('af_said').value = ''; $('af_desc').value = '';
        loadTasksSilently();
      }).withFailureHandler(function(err){
        $('assignError').textContent = err && err.message ? err.message : String(err);
      }).assignTask(payload);
    }

    function loadTasksSilently(){
      google.script.run.withSuccessHandler(function(data){
        if (data && data.error) return;
        tasksData = data || [];
        renderTasksTable();
      }).getTasks();
      if (tabLoaded.overview) loadOverview();
    }

    function renderTasksTable(){
      var rows = tasksData.filter(function(t){
        if (taskStatusFilter && t.status !== taskStatusFilter) return false;
        if (taskAmFilter && t.amEmail !== taskAmFilter) return false;
        if (taskOverdueOnly && !t.overdue) return false;
        return true;
      });
      $('taskCount').textContent = rows.length + ' of ' + tasksData.length + ' task(s)';

      if (!rows.length) {
        $('tasksTableWrap').innerHTML = '<div class="card"><div class="empty">No tasks match this filter.</div></div>';
        return;
      }

      var html = '<div class="card tablewrap" style="padding:4px"><table><thead><tr>'+
        '<th>Task</th><th>Partner</th><th>Account Manager</th><th>Status</th><th>Due</th><th>Actions</th></tr></thead><tbody>';
      rows.forEach(function(t){
        var canComplete = t.status === 'Assigned' && (t.amEmail === currentEmail || viewerIsReviewer);
        var canReview = t.status === 'Under Review' && viewerIsReviewer;
        var actions = '<button class="btn btn-light" style="padding:5px 10px;font-size:11px" onclick="toggleTaskDetail(\''+esc(t.taskId)+'\')">Details</button>';
        if (canComplete) actions += ' <button class="btn btn-green" style="padding:5px 10px;font-size:11px" onclick="openCompleteModal(\''+esc(t.taskId)+'\')">Mark Complete</button>';
        if (canReview) actions += ' <button class="btn btn-dark" style="padding:5px 10px;font-size:11px" onclick="openReviewModal(\''+esc(t.taskId)+'\',\'approve\')">Approve</button>'+
          ' <button class="btn btn-red" style="padding:5px 10px;font-size:11px" onclick="openReviewModal(\''+esc(t.taskId)+'\',\'reopen\')">Reopen</button>';

        html += '<tr class="'+(t.overdue?'overdue-row':'')+'"><td><div style="font-weight:700">'+esc(t.taskType)+'</div><div class="mono" style="font-size:10px;color:#B0B0B5">'+esc(t.taskId)+'</div></td>'+
          '<td class="mono">'+(t.partnerSaid?esc(t.partnerSaid):'—')+'</td>'+
          '<td>'+esc(t.amEmail)+'</td>'+
          '<td><span class="badge" style="background:'+(STATUS_BG[t.status]||'#F0F0F2')+';color:'+(STATUS_COLOR[t.status]||'#5A5A63')+'">'+esc(t.status)+'</span>'+
          (t.reopenCount ? ' <span style="font-size:10px;color:#8E8E93">↺'+t.reopenCount+'</span>' : '')+'</td>'+
          '<td style="color:'+(t.overdue?'#DC2626':'#5A5A63')+';font-weight:'+(t.overdue?'700':'400')+'">'+fmtDate(t.dueDate)+(t.overdue?' · overdue':'')+'</td>'+
          '<td style="white-space:nowrap">'+actions+'</td></tr>';

        if (expandedTaskId === t.taskId) {
          html += '<tr><td colspan="6" style="background:#FAFAFA"><div id="taskDetail_'+esc(t.taskId)+'" style="padding:10px 4px">'+taskDetailHtml(t)+'</div></td></tr>';
        }
      });
      html += '</tbody></table></div>';
      $('tasksTableWrap').innerHTML = html;

      if (expandedTaskId) loadTaskHistoryInto(expandedTaskId);
    }

    function taskDetailHtml(t){
      var html = '<div style="font-size:12.5px;line-height:1.7">';
      html += '<div><b>Description:</b> '+esc(t.description || '—')+'</div>';
      html += '<div><b>Assigned by:</b> '+esc(t.assignedBy)+' on '+fmtDate(t.assignedDate)+'</div>';
      if (t.amComment) html += '<div><b>AM comment:</b> '+esc(t.amComment)+'</div>';
      if (t.reviewerComment) html += '<div><b>Reviewer comment:</b> '+esc(t.reviewerComment)+' ('+esc(t.reviewedBy)+', '+fmtDate(t.reviewedDate)+')</div>';
      html += '</div><div id="historyList_'+esc(t.taskId)+'" style="margin-top:10px;font-size:11.5px;color:#5A5A63">Loading history…</div>';
      return html;
    }

    function toggleTaskDetail(taskId){
      expandedTaskId = (expandedTaskId === taskId) ? null : taskId;
      renderTasksTable();
    }

    function loadTaskHistoryInto(taskId){
      var target = $('historyList_'+taskId);
      if (!target) return;
      google.script.run.withSuccessHandler(function(rows){
        if (!rows || !rows.length) { target.innerHTML = '<i>No history recorded yet (add a TaskHistory tab to start tracking this).</i>'; return; }
        var html = '<div class="mono" style="font-size:9.5px;font-weight:700;color:#8E8E93;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">History</div>';
        rows.forEach(function(h){
          html += '<div style="padding:4px 0;border-top:1px solid #F0F0F2">'+
            fmtDate(h.at)+' — <b>'+esc(h.from_status || 'created')+' → '+esc(h.to_status)+'</b> by '+esc(h.actor_email)+
            (h.comment ? '<div style="color:#8E8E93">"'+esc(h.comment)+'"</div>' : '')+'</div>';
        });
        target.innerHTML = html;
      }).withFailureHandler(function(){ target.innerHTML = '<i>Couldn’t load history.</i>'; }).getTaskHistory(taskId);
    }

    // ---- Modals: complete / review ---------------------------------------
    function closeModal(){ $('modalRoot').innerHTML = ''; }

    function openCompleteModal(taskId){
      $('modalRoot').innerHTML =
        '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-box">'+
        '<div style="font-weight:800;font-size:15px;margin-bottom:6px">Mark task complete</div>'+
        '<div style="font-size:12px;color:#8E8E93;margin-bottom:12px">This moves the task to Under Review. Add a comment for the reviewer.</div>'+
        '<textarea id="completeComment" placeholder="What did you do?"></textarea>'+
        '<div id="completeError" style="font-size:12px;color:#DC2626;margin-top:6px"></div>'+
        '<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'+
        '<button class="btn btn-light" onclick="closeModal()">Cancel</button>'+
        '<button class="btn btn-green" onclick="submitComplete(\''+esc(taskId)+'\')">Mark Complete</button>'+
        '</div></div></div>';
    }

    function submitComplete(taskId){
      var comment = $('completeComment').value.trim();
      google.script.run.withSuccessHandler(function(res){
        if (res && res.error) { $('completeError').textContent = res.error; return; }
        closeModal();
        loadTasksSilently();
      }).withFailureHandler(function(err){
        $('completeError').textContent = err && err.message ? err.message : String(err);
      }).completeTask(taskId, comment);
    }

    function openReviewModal(taskId, decision){
      var isReopen = decision === 'reopen';
      $('modalRoot').innerHTML =
        '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-box">'+
        '<div style="font-weight:800;font-size:15px;margin-bottom:6px">'+(isReopen?'Reopen task':'Approve task')+'</div>'+
        '<div style="font-size:12px;color:#8E8E93;margin-bottom:12px">'+(isReopen
          ? 'Goes back to Assigned and re-notifies the AM by email and Slack. A comment is required so they know what to fix.'
          : 'Closes the task. A comment is optional.')+'</div>'+
        '<textarea id="reviewComment" placeholder="'+(isReopen?'What needs to change? (required)':'Optional note')+'"></textarea>'+
        '<div id="reviewError" style="font-size:12px;color:#DC2626;margin-top:6px"></div>'+
        '<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'+
        '<button class="btn btn-light" onclick="closeModal()">Cancel</button>'+
        '<button class="btn '+(isReopen?'btn-red':'btn-dark')+'" onclick="submitReview(\''+esc(taskId)+'\',\''+decision+'\')">'+(isReopen?'Reopen':'Approve')+'</button>'+
        '</div></div></div>';
    }

    function submitReview(taskId, decision){
      var comment = $('reviewComment').value.trim();
      if (decision === 'reopen' && !comment) {
        $('reviewError').textContent = 'A comment is required when reopening a task.';
        return;
      }
      google.script.run.withSuccessHandler(function(res){
        if (res && res.error) { $('reviewError').textContent = res.error; return; }
        closeModal();
        loadTasksSilently();
      }).withFailureHandler(function(err){
        $('reviewError').textContent = err && err.message ? err.message : String(err);
      }).reviewTask(taskId, decision, comment);
    }

    function duelCard(name, rank, pct, leading, otherPct, barColor){
      var h = '<div style="background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.06)">';
      h += '<div style="font-weight:700;font-size:13px;color:'+(RANK_COLOR[rank]||'#1D1D1F')+'">'+esc(name)+'</div>';
      h += '<div style="font-size:10px;color:#8E8E93;margin-top:2px">'+esc(rank)+'</div>';
      h += '<div class="bar" style="background:#F0F0F2;margin-top:10px;height:7px"><div style="width:'+pct+'%;height:100%;background:'+barColor+'"></div></div>';
      h += '<div style="margin-top:10px;padding:7px;border-radius:10px;background:#F8F8F8;font-size:11px;font-weight:600;color:#8E8E93">'+(leading?'Leading ↑':('Trailing by '+Math.max(otherPct-pct,0)+'%'))+'</div>';
      h += '</div>';
      return h;
    }

    $('amSelect').addEventListener('change', function(){ loadFor(this.value); });
    init();
    setInterval(silentRefresh, REFRESH_MS);
  </script>
</body>
</html>
